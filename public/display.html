<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>永劫无间 · 直播展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* html 永远透明，body 半透明深色作为"底" */
  html {
    height: 100%;
    background: transparent;
  }
  body {
    height: 100%;
    background: rgba(12,13,17,.72);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(230,195,119,.05), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(230,195,119,.04), transparent 45%);
    color: #e8e6e1;
    font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    transition: background .3s;
  }

  /* ===== 隐藏模式：完全透明 ===== */
  html.hidden-mode,
  body.hidden-mode {
    background: transparent !important;
    background-image: none !important;
  }
  body.hidden-mode #stage {
    display: none !important;
    visibility: hidden !important;
  }
  body.hidden-mode > *:not(script) {
    display: none !important;
  }

  #stage {
    width: 100%; height: 100%;
    padding: 20px 28px;
    display: flex; flex-direction: column;
  }

  /* ===== 通用 header ===== */
  .stage-header {
    display: flex; align-items: center;
    padding: 0 6px 14px;
    border-bottom: 1px solid rgba(230,195,119,.25);
    margin-bottom: 16px;
    flex-shrink: 0;
  }
  .stage-title {
    font-size: 24px; font-weight: 800;
    color: #e6c377; letter-spacing: .12em;
    text-shadow: 0 0 20px rgba(230,195,119,.7), 0 2px 4px rgba(0,0,0,.9);
  }
  .stage-game {
    margin-left: 22px;
    padding: 5px 16px;
    background: rgba(230,195,119,.18);
    border: 1px solid rgba(230,195,119,.5);
    border-radius: 4px;
    font-size: 14px; color: #e6c377; letter-spacing: .1em;
  }
  .stage-progress {
    margin-left: auto;
    display: flex; align-items: center; gap: 12px;
    font-size: 14px; color: #b8bcc6;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .progress-num { color: #e6c377; font-weight: 700; font-size: 18px; }
  .progress-track {
    width: 150px; height: 6px;
    background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #b8964a, #e6c377, #ffe9a8);
    box-shadow: 0 0 10px rgba(230,195,119,.6);
    transition: width .5s;
  }

  /* ===== 英雄墙 ===== */
  .hero-wall {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 14px;
    min-height: 0;
  }
  .hw-card {
    position: relative;
    border-radius: 12px;
    background: linear-gradient(160deg, rgba(30,26,20,.85), rgba(18,16,12,.92));
    border: 1px solid rgba(230,195,119,.3);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: all .4s;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .hw-card.filled {
    border-color: rgba(230,195,119,.7);
    box-shadow: 0 0 20px rgba(230,195,119,.25), inset 0 0 30px rgba(230,195,119,.05);
    animation: cardIn .5s;
  }
  @keyframes cardIn {
    0% { transform: scale(.92); box-shadow: 0 0 0 rgba(230,195,119,0); }
    50% { transform: scale(1.03); box-shadow: 0 0 40px rgba(230,195,119,.75); }
    100% { transform: scale(1); box-shadow: 0 0 20px rgba(230,195,119,.25); }
  }
  .hw-card.empty {
    border-style: dashed;
    border-color: rgba(230,195,119,.2);
  }
  .hw-hero {
    flex: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 0; overflow: hidden;
  }
  .hw-hero img {
    max-width: 90%; max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 4px 20px rgba(230,195,119,.6));
  }
  .hw-hero .placeholder {
    font-size: 100px; font-weight: 900;
    color: rgba(230,195,119,.15);
    text-shadow: 0 0 40px rgba(230,195,119,.3);
    line-height: 1; font-family: serif;
  }
  .hw-fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
    background: linear-gradient(to top, rgba(12,13,17,.98), transparent);
    pointer-events: none;
  }
  .hw-info {
    position: relative;
    padding: 8px 14px 12px;
    display: flex; align-items: center; gap: 10px;
    z-index: 2;
  }
  .hw-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(230,195,119,.2);
    border: 1.5px solid rgba(230,195,119,.7);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #e6c377; font-size: 18px;
    overflow: hidden; flex-shrink: 0;
  }
  .hw-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .hw-meta { flex: 1; min-width: 0; }
  .hw-name {
    font-size: 17px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hw-tier { font-size: 12px; color: #e6c377; margin-top: 2px; }
  .hw-score { text-align: right; flex-shrink: 0; }
  .hw-score-now {
    font-size: 22px; font-weight: 900;
    color: #e6c377;
    text-shadow: 0 0 14px rgba(230,195,119,.7), 0 2px 4px rgba(0,0,0,.9);
    line-height: 1;
  }
  .hw-score-total { font-size: 11px; color: #a8acb6; margin-top: 3px; }

  /* ===== 聚焦 / 轮播 ===== */
  .focus-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0;
  }
  .focus-hero {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .focus-hero img {
    width: 1280px;
    height: 720px;
    max-width: 90vw;
    max-height: 82vh;
    object-fit: contain;
    filter: drop-shadow(0 0 40px rgba(230,195,119,.8))
            drop-shadow(0 0 80px rgba(230,195,119,.4));
    animation: heroIn .6s;
  }
  @keyframes heroIn {
    from { opacity: 0; transform: scale(.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .focus-card {
    position: absolute;
    left: 50px; bottom: 50px;
    background: linear-gradient(160deg, rgba(20,17,12,.9), rgba(30,24,16,.88));
    border: 2px solid rgba(230,195,119,.7);
    border-radius: 18px;
    padding: 28px 36px;
    box-shadow: 0 0 50px rgba(230,195,119,.5);
    min-width: 620px;
    z-index: 2;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .focus-card .name {
    font-size: 42px; font-weight: 900; color: #fff;
    text-shadow: 0 0 24px rgba(230,195,119,.8), 0 2px 6px rgba(0,0,0,.9);
    margin-bottom: 10px;
    letter-spacing: .02em;
  }
  .focus-card .meta {
    font-size: 18px; color: #b8bcc6;
    display: flex; gap: 22px;
  }
  .focus-card .meta .tier { color: #e6c377; font-weight: 700; font-size: 20px; }
  .focus-card .scores {
    display: flex; gap: 48px;
    padding-top: 20px; margin-top: 20px;
    border-top: 1px solid rgba(230,195,119,.3);
  }
  .focus-card .score-item { display: flex; flex-direction: column; gap: 6px; }
  .focus-card .score-label {
    font-size: 14px; color: #b8bcc6; letter-spacing: .12em;
  }
  .focus-card .score-val {
    font-size: 38px; font-weight: 900;
    color: #e6c377;
    text-shadow: 0 0 20px rgba(230,195,119,.7), 0 2px 6px rgba(0,0,0,.9);
    line-height: 1;
  }
  .focus-card .score-val.plain {
    color: #d5d3ce; font-size: 32px; text-shadow: 0 2px 6px rgba(0,0,0,.9);
  }
  .focus-badge {
    position: absolute; top: 30px; right: 30px;
    font-size: 20px; font-weight: 900;
    padding: 10px 22px; border-radius: 8px;
    letter-spacing: .15em; z-index: 3;
  }
  .focus-badge.mp {
    color: #fff; background: #e74c3c;
    box-shadow: 0 0 30px rgba(231,76,60,.9);
    animation: mpPulse 1s infinite alternate;
  }
  .focus-badge.champ {
    color: #0c0d11;
    background: linear-gradient(135deg, #ffe9a8, #e6c377);
    box-shadow: 0 0 30px rgba(230,195,119,.9);
  }
  @keyframes mpPulse {
    from { box-shadow: 0 0 20px rgba(231,76,60,.6); }
    to { box-shadow: 0 0 40px rgba(231,76,60,1); }
  }
  .carousel-dots {
    position: absolute; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 9px; z-index: 5;
  }
  .carousel-dots .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(230,195,119,.3);
    transition: all .3s;
  }
  .carousel-dots .dot.active {
    background: #e6c377;
    box-shadow: 0 0 12px rgba(230,195,119,.9);
    transform: scale(1.4);
  }
  .carousel-counter {
    position: absolute; bottom: 44px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px; color: #b8bcc6;
    letter-spacing: .15em; z-index: 5;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .carousel-counter .n {
    color: #e6c377; font-weight: 700; font-size: 15px;
  }
  .carousel-idle {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
  }
  .carousel-idle .hint {
    font-size: 22px; color: #e6c377; letter-spacing: .12em;
    text-shadow: 0 0 20px rgba(230,195,119,.7), 0 2px 6px rgba(0,0,0,.9);
  }
  .carousel-idle .sub { font-size: 14px; color: #8b8f9a; }

  /* ===== 积分榜 ===== */
  .scoreboard-wrap {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
  }
  .champ-banner {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 12px; margin-bottom: 14px;
    background: linear-gradient(90deg,
      rgba(230,195,119,.2), rgba(230,195,119,.45), rgba(230,195,119,.2));
    border: 1px solid rgba(230,195,119,.8);
    border-radius: 8px;
    font-size: 22px; font-weight: 800; color: #ffe9a8;
    text-shadow: 0 0 20px rgba(230,195,119,1), 0 2px 6px rgba(0,0,0,.9);
    animation: champGlow 2s infinite alternate;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  @keyframes champGlow {
    from { box-shadow: 0 0 20px rgba(230,195,119,.4); }
    to { box-shadow: 0 0 50px rgba(230,195,119,.9); }
  }
  .scoreboard {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    border: 1px solid rgba(230,195,119,.35);
    border-radius: 10px;
    background: rgba(18,16,12,.6);
    overflow: hidden;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .sb-head {
    display: grid;
    grid-template-columns: 70px 70px 1fr repeat(5, 100px) 160px;
    padding: 12px 10px;
    background: rgba(230,195,119,.12);
    border-bottom: 1px solid rgba(230,195,119,.25);
    font-size: 13px; color: #e6c377;
    letter-spacing: .08em; font-weight: 500;
    text-align: center;
    flex-shrink: 0;
  }
  .sb-head > *:nth-child(3) { text-align: left; padding-left: 14px; }
  .sb-head > *:last-child { color: #ffe9a8; font-weight: 800; font-size: 15px; }
  .sb-body {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
  }
  .sb-row {
    display: grid;
    grid-template-columns: 70px 70px 1fr repeat(5, 100px) 160px;
    align-items: center;
    padding: 6px 10px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    text-align: center;
    flex: 1; min-height: 0;
    transition: background .3s;
  }
  .sb-row:last-child { border-bottom: none; }
  .sb-row.champion {
    background: linear-gradient(90deg, rgba(230,195,119,.2), transparent);
  }
  .sb-row .place {
    font-size: 22px; font-weight: 900; color: #b8bcc6;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .sb-row .place.p1 { color: #ffd700; text-shadow: 0 0 14px rgba(255,215,0,.8), 0 2px 4px rgba(0,0,0,.9); }
  .sb-row .place.p2 { color: #e0e0e0; text-shadow: 0 0 10px rgba(224,224,224,.5), 0 2px 4px rgba(0,0,0,.9); }
  .sb-row .place.p3 { color: #d18a4a; text-shadow: 0 0 10px rgba(209,138,74,.5), 0 2px 4px rgba(0,0,0,.9); }
  .sb-row .avatar-cell { display: flex; justify-content: center; }
  .sb-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(230,195,119,.2);
    border: 1.5px solid rgba(230,195,119,.6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #e6c377; font-size: 17px;
    overflow: hidden;
  }
  .sb-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .sb-row .name-cell {
    text-align: left; padding-left: 14px;
    font-size: 19px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 8px;
  }
  .sb-row .name-cell .champ-tag {
    font-size: 11px; color: #0c0d11;
    background: linear-gradient(135deg, #ffe9a8, #e6c377);
    padding: 3px 10px; border-radius: 10px;
    font-weight: 800; letter-spacing: .05em;
    text-shadow: none;
  }
  .sb-row .game-score {
    font-size: 15px; color: #5a5a5a;
  }
  .sb-row .game-score.has {
    color: #e0ddd6; font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .sb-row .game-score.mp {
    color: #e6c377; font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .sb-row .game-score .mp-mark {
    font-size: 10px; color: #e74c3c; font-weight: 900;
    vertical-align: super; margin-left: 2px;
  }
  .sb-row .total-cell {
    font-size: 28px; font-weight: 900;
    color: #e6c377;
    text-shadow: 0 0 18px rgba(230,195,119,.7), 0 2px 6px rgba(0,0,0,.9);
    letter-spacing: -.02em;
  }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #8b8f9a; font-size: 16px;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
const API = '';
const stage = document.getElementById('stage');

let currentData = null;
let carouselTimer = null;
let carouselIdx = 0;
let carouselPhase = 'idle';
const CAROUSEL_PLAYER_MS = 5000;
const CAROUSEL_WALL_MS = 3000;

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
const stripExt = n => String(n).replace(/\.[^/.]+$/, '');
const fmtScore = n => (n || 0).toFixed(1);

const evtSource = new EventSource(API + '/api/events');
evtSource.onmessage = (e) => {
  try { handleData(JSON.parse(e.data)); } catch (err) { console.error(err); }
};
evtSource.onerror = () => console.warn('SSE 断开，自动重连…');

/* ============ 隐藏模式开关 ============ */
function setHiddenMode(on) {
  if (on) {
    document.documentElement.classList.add('hidden-mode');
    document.body.classList.add('hidden-mode');
  } else {
    document.documentElement.classList.remove('hidden-mode');
    document.body.classList.remove('hidden-mode');
  }
}

function handleData(data) {
  const prevMode = currentData?.displayMode;
  const prevRunning = currentData?.carouselRunning;
  currentData = data;

  const mode = data.displayMode || 'hero-wall';

  if (prevMode !== mode) stopCarousel();

  if (mode === 'hidden') {
    stopCarousel();
    renderHidden();
    return;
  }

  setHiddenMode(false);
  stage.style.display = '';
  stage.style.visibility = '';

  if (mode === 'hero-wall') {
    renderHeroWall(data);
  } else if (mode === 'focus') {
    renderFocus(data);
  } else if (mode === 'carousel') {
    if (data.carouselRunning) {
      if (!prevRunning) {
        stopCarousel();
        startCarousel();
      } else {
        updateCarouselContent();
      }
    } else {
      stopCarousel();
      renderCarouselIdle(data);
    }
  } else if (mode === 'scoreboard') {
    renderScoreboard(data);
  }
}

/* ============ 隐藏模式 ============ */
function renderHidden() {
  setHiddenMode(true);
  stage.innerHTML = '';
  stage.style.display = 'none';
  stage.style.visibility = 'hidden';
}

/* ============ Header ============ */
function buildHeader(data, titleText) {
  const players = data.players || [];
  const selectedCount = players.filter(p => p.heroes && p.heroes[data.currentGame]).length;
  const total = players.length;
  const pct = total > 0 ? (selectedCount / total * 100) : 0;
  return `
    <div class="stage-header">
      <div class="stage-title">${titleText}</div>
      <div class="stage-game">第 ${data.currentGame + 1} 局</div>
      <div class="stage-progress">
        <span>已选</span>
        <span class="progress-num">${selectedCount}/${total}</span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
  `;
}

/* ============ 英雄墙 ============ */
function renderHeroWall(data) {
  const players = data.players || [];
  const g = data.currentGame;

  let cardsHtml = '';
  players.forEach(p => {
    const hero = (p.heroes && p.heroes[g]) || '';
    const safeId = escapeHtml(stripExt(p.id));
    const initial = safeId.charAt(0) || '?';
    const tier = p.tier ? escapeHtml(p.tier) : '';

    const kills = p.kills[g] || 0;
    const rank = p.ranks[g];
    const killPoints = kills * 1.5;
    const rankPoints = rank
      ? (rank === 1 ? 8 : rank === 2 ? 6 : rank === 3 ? 5
         : rank === 4 ? 4 : rank === 5 ? 3 : rank === 6 ? 2 : rank === 7 ? 1 : 0)
      : 0;
    const gameScore = killPoints + rankPoints;

    let total = 0;
    for (let i = 0; i < data.maxGames; i++) {
      const k = p.kills[i] || 0;
      const r = p.ranks[i];
      total += k * 1.5;
      total += r ? (r === 1 ? 8 : r === 2 ? 6 : r === 3 ? 5 : r === 4 ? 4 : r === 5 ? 3 : r === 6 ? 2 : r === 7 ? 1 : 0) : 0;
    }

    const avatarHtml = p.avatar
      ? `<img src="/avatars/${encodeURIComponent(p.avatar)}" onerror="this.parentNode.textContent='${initial}'">`
      : initial;

    if (hero) {
      cardsHtml += `
        <div class="hw-card filled">
          <div class="hw-hero">
            <img src="/heroes/${encodeURIComponent(hero)}" onerror="this.style.visibility='hidden'">
            <div class="hw-fade"></div>
          </div>
          <div class="hw-info">
            <div class="hw-avatar">${avatarHtml}</div>
            <div class="hw-meta">
              <div class="hw-name">${safeId}</div>
              ${tier ? `<div class="hw-tier">${tier}</div>` : ''}
            </div>
            <div class="hw-score">
              <div class="hw-score-now">+${fmtScore(gameScore)}</div>
              <div class="hw-score-total">总 ${fmtScore(total)}</div>
            </div>
          </div>
        </div>
      `;
    } else {
      cardsHtml += `
        <div class="hw-card empty">
          <div class="hw-hero">
            <div class="placeholder">?</div>
          </div>
          <div class="hw-info">
            <div class="hw-avatar">${avatarHtml}</div>
            <div class="hw-meta">
              <div class="hw-name">${safeId}</div>
              ${tier ? `<div class="hw-tier">${tier}</div>` : ''}
            </div>
            <div class="hw-score">
              <div class="hw-score-now" style="color:#444;text-shadow:none">+0.0</div>
              <div class="hw-score-total">总 ${fmtScore(total)}</div>
            </div>
          </div>
        </div>
      `;
    }
  });

  stage.innerHTML = buildHeader(data, '永劫无间 · 英雄墙') +
    `<div class="hero-wall">${cardsHtml}</div>`;
}

/* ============ 聚焦 / 轮播 共用 ============ */
function buildFocusBody(data, p, showDots) {
  const g = data.currentGame;
  const hero = (p.games[g] && p.games[g].hero) || '';
  const safeId = escapeHtml(stripExt(p.id));
  const initial = safeId.charAt(0) || '?';
  const gameData = p.games[g] || {};
  const gameScore = gameData.gameTotal || 0;
  const rank = gameData.rank;
  const kills = gameData.kills || 0;

  const isMP = p.total >= (data.threshold || 19) && !p.isChampion;
  const badgeHtml = p.isChampion
    ? '<div class="focus-badge champ">🏆 冠军</div>'
    : (isMP ? '<div class="focus-badge mp">赛 点</div>' : '');

  const heroHtml = hero
    ? `<img src="/heroes/${encodeURIComponent(hero)}" onerror="this.style.visibility='hidden'">`
    : `<div style="font-size:140px;color:rgba(230,195,119,.15);font-weight:900;font-family:serif;">?</div>`;

  const avatarHtml = p.avatar
    ? `<img src="/avatars/${encodeURIComponent(p.avatar)}" onerror="this.parentNode.textContent='${initial}'">`
    : initial;

  const standings = data.standings || [];
  const dotsHtml = showDots
    ? `<div class="carousel-dots">
         ${standings.map((_, i) => `<div class="dot${i === carouselIdx ? ' active' : ''}"></div>`).join('')}
       </div>
       <div class="carousel-counter">
         <span class="n">${carouselIdx + 1}</span> / ${standings.length}
       </div>`
    : '';

  return `
    <div class="focus-wrap">
      ${badgeHtml}
      <div class="focus-hero">${heroHtml}</div>
      <div class="focus-card">
        <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;">
          <div class="hw-avatar" style="width:88px;height:88px;font-size:36px;">${avatarHtml}</div>
          <div>
            <div class="name">${safeId}</div>
            <div class="meta">
              ${p.tier ? `<span class="tier">${escapeHtml(p.tier)}</span>` : ''}
              ${p.damage ? `<span>场伤 ${escapeHtml(String(p.damage))}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="scores">
          <div class="score-item">
            <div class="score-label">总分</div>
            <div class="score-val">${fmtScore(p.total)}</div>
          </div>
          <div class="score-item">
            <div class="score-label">本局得分</div>
            <div class="score-val">+${fmtScore(gameScore)}</div>
          </div>
          <div class="score-item">
            <div class="score-label">本局击杀</div>
            <div class="score-val plain">${kills}</div>
          </div>
          <div class="score-item">
            <div class="score-label">本局排名</div>
            <div class="score-val plain">${rank ? '#' + rank : '—'}</div>
          </div>
        </div>
      </div>
      ${dotsHtml}
    </div>
  `;
}

/* ============ 聚焦 ============ */
function renderFocus(data) {
  const id = data.focusPlayerId;
  const p = (data.standings || []).find(x => x.id === id);
  if (!p) {
    stage.innerHTML = buildHeader(data, '永劫无间 · 聚焦') +
      '<div class="empty-state">请在控制台选择要聚焦的选手</div>';
    return;
  }
  stage.innerHTML = buildHeader(data, '永劫无间 · 聚焦') + buildFocusBody(data, p, false);
}

/* ============ 轮播 ============ */
function startCarousel() {
  const data = currentData;
  if (!data || !data.standings || data.standings.length === 0) return;
  carouselIdx = 0;
  carouselPhase = 'player';
  renderCarouselPlayer();
  scheduleNext();
}

function scheduleNext() {
  clearTimeout(carouselTimer);
  if (carouselPhase === 'player') {
    carouselTimer = setTimeout(() => {
      const total = (currentData.standings || []).length;
      carouselIdx++;
      if (carouselIdx >= total) {
        carouselPhase = 'wall';
        renderCarouselWall();
        carouselTimer = setTimeout(() => {
          carouselIdx = 0;
          carouselPhase = 'player';
          renderCarouselPlayer();
          scheduleNext();
        }, CAROUSEL_WALL_MS);
      } else {
        renderCarouselPlayer();
        scheduleNext();
      }
    }, CAROUSEL_PLAYER_MS);
  }
}

function stopCarousel() {
  clearTimeout(carouselTimer);
  carouselTimer = null;
  carouselPhase = 'idle';
}

function renderCarouselPlayer() {
  if (!currentData) return;
  const p = (currentData.standings || [])[carouselIdx];
  if (!p) return;
  stage.innerHTML = buildHeader(currentData, '永劫无间 · 选手巡礼') +
    buildFocusBody(currentData, p, true);
}

function renderCarouselWall() {
  if (!currentData) return;
  renderHeroWall(currentData);
}

function renderCarouselIdle(data) {
  stage.innerHTML = buildHeader(data, '永劫无间 · 选手巡礼') + `
    <div class="carousel-idle">
      <div class="hint">已就绪</div>
      <div class="sub">管理员点击「开始轮播」后自动播放</div>
    </div>
  `;
}

function updateCarouselContent() {
  if (carouselPhase === 'player') renderCarouselPlayer();
  else if (carouselPhase === 'wall') renderCarouselWall();
}

/* ============ 积分榜 ============ */
function renderScoreboard(data) {
  const standings = data.standings || [];
  const maxGames = data.maxGames || 5;
  const threshold = data.threshold || 19;

  let headHtml = '<div class="sb-head"><div>名次</div><div>头像</div><div>选手</div>';
  for (let g = 0; g < maxGames; g++) headHtml += `<div>第${g + 1}局</div>`;
  headHtml += '<div>总分</div></div>';

  const champ = standings.find(p => p.isChampion);
  const champHtml = champ
    ? `<div class="champ-banner">🏆 冠军：${escapeHtml(stripExt(champ.id))}</div>`
    : '';

  let bodyHtml = '';
  standings.forEach((p, i) => {
    const place = p.place || i + 1;
    const placeCls = place === 1 ? 'p1' : place === 2 ? 'p2' : place === 3 ? 'p3' : '';
    const safeId = escapeHtml(stripExt(p.id));
    const initial = safeId.charAt(0) || '?';
    const avatarHtml = p.avatar
      ? `<img src="/avatars/${encodeURIComponent(p.avatar)}" onerror="this.parentNode.textContent='${initial}'">`
      : initial;

    bodyHtml += `<div class="sb-row${p.isChampion ? ' champion' : ''}">`;
    bodyHtml += `<div class="place ${placeCls}">${place}</div>`;
    bodyHtml += `<div class="avatar-cell"><div class="sb-avatar">${avatarHtml}</div></div>`;
    bodyHtml += `<div class="name-cell">${safeId}${p.isChampion ? '<span class="champ-tag">🏆 冠军</span>' : ''}</div>`;

    for (let g = 0; g < maxGames; g++) {
      const game = p.games[g];
      const score = game ? game.gameTotal : 0;
      const hasScore = score > 0;
      let cls = 'game-score';
      let inner = hasScore ? fmtScore(score) : '—';
      if (game && game.totalBefore < threshold && (game.totalBefore + game.gameTotal) >= threshold) {
        cls += ' mp';
        inner += '<span class="mp-mark">赛</span>';
      } else if (hasScore) {
        cls += ' has';
      }
      bodyHtml += `<div class="${cls}">${inner}</div>`;
    }

    bodyHtml += `<div class="total-cell">${fmtScore(p.total)}</div>`;
    bodyHtml += `</div>`;
  });

  if (standings.length === 0) {
    bodyHtml = '<div class="empty-state">等待数据…</div>';
  }

  stage.innerHTML = `
    ${buildHeader(data, '永劫无间 · 赛点积分榜')}
    <div class="scoreboard-wrap">
      ${champHtml}
      <div class="scoreboard">
        ${headHtml}
        <div class="sb-body">${bodyHtml}</div>
      </div>
    </div>
  `;
}

/* ============ 初始 ============ */
stage.innerHTML = '<div class="empty-state">连接中…</div>';
</script>
</body>
