<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>永劫无间 · 选手卡片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; overflow: hidden; }
  .card { position: absolute; right: 20px; top: 50%; transform: translateY(-50%) translateX(30px); width: 680px; background: linear-gradient(135deg, rgba(20,18,14,.78) 0%, rgba(28,22,14,.72) 100%); border: 1.5px solid rgba(230,195,119,.55); border-radius: 16px; box-shadow: 0 0 30px rgba(230,195,119,.3), inset 0 0 45px rgba(230,195,119,.04); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #e8e6e1; padding: 38px 24px 20px 24px; opacity: 0; transition: all .5s cubic-bezier(.4,0,.2,1); pointer-events: none; overflow: visible; }
  .card.show { opacity: 1; transform: translateY(-50%) translateX(0); }
  .big-rank { position: absolute; top: -14px; left: -14px; min-width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, rgba(230,195,119,.95), rgba(180,145,70,.95)); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(230,195,119,.6); z-index: 20; }
  .big-rank-num { font-size: 24px; font-weight: 900; color: #0c0d11; letter-spacing: -.02em; line-height: 1; }
  .big-rank.p1 { background: linear-gradient(135deg, #ffe066, #ffb700); }
  .big-rank.p2 { background: linear-gradient(135deg, #e8e8e8, #a8a8a8); }
  .big-rank.p3 { background: linear-gradient(135deg, #e0a060, #a06030); }
  .top-row { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(230,195,119,.22); padding-right: 180px; }
  .avatar-wrap { width: 82px; height: 82px; border-radius: 50%; background: radial-gradient(circle, rgba(230,195,119,.18), rgba(230,195,119,.02)); border: 2px solid rgba(230,195,119,.7); box-shadow: 0 0 20px rgba(230,195,119,.45); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-empty { color: #e6c377; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .name-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .name-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pname { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: .03em; text-shadow: 0 0 16px rgba(230,195,119,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 4px; letter-spacing: .08em; white-space: nowrap; }
  .badge.mp { color: #fff; background: #e74c3c; box-shadow: 0 0 14px rgba(231,76,60,.75); animation: mpPulse 1s infinite alternate; }
  @keyframes mpPulse { from { box-shadow: 0 0 8px rgba(231,76,60,.5); } to { box-shadow: 0 0 22px rgba(231,76,60,1); } }
  .badge.champ { color: #0c0d11; background: linear-gradient(135deg, #ffe9a8, #e6c377); box-shadow: 0 0 16px rgba(230,195,119,.9); }
  .total-mini { font-size: 14px; color: #e6c377; font-weight: 700; letter-spacing: .05em; }
  .total-mini .num { font-size: 24px; font-weight: 900; text-shadow: 0 0 14px rgba(230,195,119,.55); margin-left: 6px; }
  .hero-wrap { position: absolute; right: 0px; top: -125px; width: 430px; height: 256px; display: flex; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
  .hero-wrap img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 20px rgba(230,195,119,.8)) drop-shadow(0 0 40px rgba(230,195,119,.4)); }
  .hero-wrap.empty::before { content: '?'; color: rgba(230,195,119,.3); font-size: 120px; font-weight: 900; text-shadow: 0 0 35px rgba(230,195,119,.5); }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .stat-box { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 12px 6px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
  .stat-box .label { font-size: 12px; color: #8b8f9a; letter-spacing: .1em; }
  .stat-box .value { font-size: 22px; font-weight: 800; color: #e6c377; line-height: 1.2; text-shadow: 0 0 12px rgba(230,195,119,.45); }
  .stat-box .value.plain { color: #d5d3ce; font-weight: 700; text-shadow: none; font-size: 18px; }
  .current-line { margin-top: 14px; padding: 10px 14px; background: linear-gradient(90deg, rgba(230,195,119,.14) 0%, rgba(230,195,119,.04) 100%); border-left: 4px solid #e6c377; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
  .current-line .tag { color: #e6c377; font-weight: 700; letter-spacing: .1em; }
  .current-line .val { color: #fff; font-weight: 700; font-size: 16px; }
  .current-line .val .mark { color: #e74c3c; font-size: 13px; vertical-align: super; margin-left: 3px; text-shadow: 0 0 8px rgba(231,76,60,.9); }
  .bottom-game-tag { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #e6c377, #b8964a); color: #0c0d11; font-size: 13px; font-weight: 800; padding: 4px 20px; border-radius: 12px; letter-spacing: .1em; box-shadow: 0 4px 12px rgba(0,0,0,.5), 0 0 15px rgba(230,195,119,.4); white-space: nowrap; z-index: 30; }
</style>
</head>
<body>
<div id="card" class="card">
  <div class="big-rank" id="bigRank"><div class="big-rank-num" id="placeBig">#1</div></div>
  <div class="hero-wrap empty" id="heroWrap"></div>
  <div class="top-row">
    <div class="avatar-wrap" id="avatarWrap"></div>
    <div class="name-info">
      <div class="name-line"><span class="pname" id="pname">选手名字</span><span class="badge mp" id="mpBadge" style="display:none">赛 点</span><span class="badge champ" id="champBadge" style="display:none">🏆 冠军</span></div>
      <div class="total-mini">总分<span class="num" id="totalNum">0.0</span></div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-box"><div class="label">总击杀</div><div class="value plain" id="totalKills">0</div></div>
    <div class="stat-box"><div class="label">吃鸡</div><div class="value plain" id="totalWins">0</div></div>
    <div class="stat-box"><div class="label">当前局得分</div><div class="value" id="currentScore">0.0</div></div>
    <div class="stat-box"><div class="label">当前局排名</div><div class="value plain" id="currentRank">-</div></div>
  </div>
  <div class="current-line"><span class="tag" id="currentTag">第1局 · 进行中</span><span class="val" id="currentDetail">0 杀 · 未排名</span></div>
  <div class="bottom-game-tag" id="bottomGameTag">第1局</div>
</div>

<script>
const API = 'https://match-production-529746ca.up.railway.app';
const card = document.getElementById('card');
let currentRenderedId = null;
let switchTimer = null;
const SWITCH_DURATION = 500;

// 预加载控制
let isPreloaded = false;
function preloadAssets() {
  if (isPreloaded) return;
  isPreloaded = true;
  fetch(API + '/api/state').then(res => res.json()).then(data => {
    if (data.assets) {
      (data.assets.heroes || []).forEach(h => new Image().src = `/heroes/${encodeURIComponent(h)}`);
      (data.assets.avatars || []).forEach(a => new Image().src = `/avatars/${encodeURIComponent(a)}`);
      console.log('✅ 导播卡后台预加载完成');
    }
  }).catch(e => console.error('预加载失败', e));
}

function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function stripExt(name) { return String(name).replace(/\.[^/.]+$/, ''); }

function updateCardContent(p, data) {
  const { maxGames, threshold, currentGame } = data;
  const place = p.place || 0;
  document.getElementById('placeBig').textContent = '#' + place;
  document.getElementById('bigRank').className = 'big-rank' + (place === 1 ? ' p1' : place === 2 ? ' p2' : place === 3 ? ' p3' : '');

  const avatarWrap = document.getElementById('avatarWrap');
  if (p.avatar) {
    avatarWrap.innerHTML = `<img src="/avatars/${encodeURIComponent(p.avatar)}" onerror="this.parentNode.innerHTML='<div class=\\'avatar-empty\\'>${escapeHtml(stripExt(p.id)).charAt(0) || '?'}</div>'">`;
  } else {
    avatarWrap.innerHTML = `<div class="avatar-empty">${escapeHtml(stripExt(p.id)).charAt(0) || '?'}</div>`;
  }

  document.getElementById('pname').textContent = p.id;
  const isMP = p.total >= (threshold || 39);
  document.getElementById('mpBadge').style.display = (isMP && !p.isChampion) ? 'inline-block' : 'none';
  document.getElementById('champBadge').style.display = p.isChampion ? 'inline-block' : 'none';
  document.getElementById('totalNum').textContent = p.total.toFixed(1);

  let totalKills = 0, totalWins = 0;
  for (let g = 0; g < (maxGames || 5); g++) {
    const game = p.games[g];
    if (game) { totalKills += game.kills || 0; if (game.rank === 1) totalWins++; }
  }
  document.getElementById('totalKills').textContent = totalKills;
  document.getElementById('totalWins').textContent = totalWins;

  const cg = currentGame || 0;
  const currentGameData = p.games[cg] || { kills: 0, rank: null, gameTotal: 0, hero: '' };
  const heroWrap = document.getElementById('heroWrap');
  if (currentGameData.hero) {
    heroWrap.className = 'hero-wrap';
    heroWrap.innerHTML = `<img src="/heroes/${encodeURIComponent(currentGameData.hero)}" onerror="this.parentNode.classList.add('empty');this.remove()">`;
  } else {
    heroWrap.className = 'hero-wrap empty';
    heroWrap.innerHTML = '';
  }
  document.getElementById('bottomGameTag').textContent = `第${cg + 1}局`;
  document.getElementById('currentScore').textContent = (currentGameData.gameTotal || 0).toFixed(1);
  const rankVal = currentGameData.rank;
  document.getElementById('currentRank').textContent = rankVal ? '#' + rankVal : '-';
  const kills = currentGameData.kills || 0;
  const detailParts = [kills + ' 杀', rankVal ? '排名 #' + rankVal : '未排名'];
  document.getElementById('currentTag').textContent = `第${cg + 1}局 · 进行中`;
  
  let mpMark = '';
  const gameObj = p.games[cg];
  if (gameObj && gameObj.totalBefore < (threshold || 39) && (gameObj.totalBefore + gameObj.gameTotal) >= (threshold || 39)) {
    mpMark = '<span class="mark">赛</span>';
  }
  document.getElementById('currentDetail').innerHTML = detailParts.join(' · ') + mpMark;
}

function render(data) {
  if (!isPreloaded) preloadAssets(); // 第一次接数据触发预加载
  const { standings, cardPlayerId } = data;
  if (!cardPlayerId || !standings || standings.length === 0) {
    if (switchTimer) clearTimeout(switchTimer); switchTimer = null; currentRenderedId = null; card.classList.remove('show'); return;
  }
  const p = standings.find(x => x.id === cardPlayerId);
  if (!p) {
    if (switchTimer) clearTimeout(switchTimer); switchTimer = null; currentRenderedId = null; card.classList.remove('show'); return;
  }
  updateCardContent(p, data);
  if (currentRenderedId === cardPlayerId) {
    if (!switchTimer) card.classList.add('show');
    return;
  }
  if (switchTimer) clearTimeout(switchTimer);
  currentRenderedId = cardPlayerId;
  card.classList.remove('show');
  switchTimer = setTimeout(() => { switchTimer = null; card.classList.add('show'); }, SWITCH_DURATION);
}

const evtSource = new EventSource(API + '/api/events');
evtSource.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (err) { console.error('解析数据失败', err); } };
evtSource.onerror = () => console.warn('SSE 连接断开，尝试重连...');
</script>
</body>
</html>
